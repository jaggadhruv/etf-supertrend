name: ETF Supertrend daily scan

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC Mon-Fri: after the US close (India closed at 10:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scan.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reports index.html
          git diff --cached --quiet || git commit -m "ETF scan $(date -u +%Y-%m-%d)"
          git push
